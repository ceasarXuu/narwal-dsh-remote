name: Publish DSH plugin to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked package to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-dsh-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check and pack plugin
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          npm run check
          npm run pack -- "$RUNNER_TEMP"
          version=$(node -p "require('./package.json').version")
          archive="$RUNNER_TEMP/narwal-dsh-remote-$version.tgz"
          for file in package.json index.js impl.js client.js cordis.patch.yml icon.svg vendor/toqr.mjs; do
            tar -tzf "$archive" "package/$file" >/dev/null
          done
          echo "NARWAL_NPM_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Publish with npm Trusted Publishing
        if: inputs.publish
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm publish "$NARWAL_NPM_ARCHIVE" --access public
